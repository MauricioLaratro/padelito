name: Publicacion diaria Padelito

on:
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * *"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar pieza diaria
        run: npm run social:generate
        env:
          PUBLIC_MEDIA_BASE_URL: ${{ secrets.PUBLIC_MEDIA_BASE_URL || format('https://raw.githubusercontent.com/{0}/{1}/public', github.repository, github.ref_name) }}

      - name: Guardar pieza generada
        run: |
          git config user.name "Padelito Bot"
          git config user.email "padelito-bot@users.noreply.github.com"
          git add public/social
          git diff --cached --quiet || git commit -m "Generar pieza social diaria"
          git push

      - name: Esperar disponibilidad publica
        run: sleep ${MEDIA_DEPLOY_WAIT_SECONDS:-60}

      - name: Publicar en Meta
        run: |
          if [ -n "$META_ACCESS_TOKEN" ]; then
            npm run social:publish:meta
          else
            echo "META_ACCESS_TOKEN no configurado; se omite Meta."
          fi
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_GRAPH_VERSION: ${{ secrets.META_GRAPH_VERSION }}
          META_PUBLISH_FACEBOOK: ${{ secrets.META_PUBLISH_FACEBOOK }}
          META_PUBLISH_STORY: ${{ secrets.META_PUBLISH_STORY }}

      - name: Publicar en TikTok
        run: |
          if [ -n "$TIKTOK_REFRESH_TOKEN" ]; then
            npm run social:publish:tiktok
          else
            echo "TIKTOK_REFRESH_TOKEN no configurado; se omite TikTok."
          fi
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_PRIVACY_LEVEL: ${{ secrets.TIKTOK_PRIVACY_LEVEL }}
