name: Publicacion diaria Padelito

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar pieza diaria
        run: npm run social:generate
        env:
          PUBLIC_MEDIA_BASE_URL: ${{ secrets.PUBLIC_MEDIA_BASE_URL }}

      - name: Guardar pieza generada
        run: |
          git config user.name "Padelito Bot"
          git config user.email "padelito-bot@users.noreply.github.com"
          git add public/social
          git diff --cached --quiet || git commit -m "Generar pieza social diaria"
          git push

      - name: Esperar despliegue publico
        if: ${{ secrets.META_ACCESS_TOKEN != '' }}
        run: sleep ${MEDIA_DEPLOY_WAIT_SECONDS:-180}

      - name: Publicar en Meta
        if: ${{ secrets.META_ACCESS_TOKEN != '' }}
        run: npm run social:publish:meta
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_GRAPH_VERSION: ${{ secrets.META_GRAPH_VERSION }}
          META_PUBLISH_FACEBOOK: ${{ secrets.META_PUBLISH_FACEBOOK }}
