<svg width="840" height="220" viewBox="0 0 840 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Padelito">
  <title>Padelito</title>
  <defs>
    <linearGradient id="silver" x1="0" y1="20" x2="0" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.42" stop-color="#DCDCDC"/>
      <stop offset="1" stop-color="#B8B8B8"/>
    </linearGradient>
    <radialGradient id="ball" cx="35%" cy="28%" r="75%">
      <stop offset="0" stop-color="#F4FF54"/>
      <stop offset="0.55" stop-color="#D7F21A"/>
      <stop offset="1" stop-color="#A3B900"/>
    </radialGradient>
  </defs>

  <!-- Fondo transparente intencionalmente: no agregar rect de fondo -->

  <!-- P / isotipo inicial -->
  <g transform="translate(18 12)">
    <path d="M86 22 H158 C214 22 252 58 252 104 C252 150 214 186 158 186 H113 L87 215 H43 L88 162 H158 C186 162 207 139 207 104 C207 69 186 46 158 46 H86 C75 46 68 37 72 30 C75 25 80 22 86 22Z"
          fill="url(#silver)"/>
    <circle cx="84" cy="104" r="13" fill="url(#silver)"/>
    <circle cx="121" cy="104" r="13" fill="url(#silver)"/>
    <circle cx="158" cy="104" r="13" fill="url(#silver)"/>
    <circle cx="198" cy="104" r="23" fill="url(#ball)"/>
  </g>

  <!-- Wordmark grande, compacto y legible en mobile. La P del isotipo funciona como inicial. -->
  <text x="272" y="139"
        font-family="Inter, Manrope, Sora, Arial, sans-serif"
        font-size="92"
        font-weight="850"
        letter-spacing="1"
        fill="url(#silver)">adelito</text>
</svg>
